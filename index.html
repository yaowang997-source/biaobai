<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ 给你的一封信 ✦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#0f0f30 0%,#050515 100%);font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:transparent}
#stage{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;width:88%;max-width:380px;text-align:center}
.line{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;margin:6px 0;color:#d4d4e8;font-size:17px;line-height:1.8}
.line.show{opacity:1;transform:translateY(0)}
.line.pink{color:#f0a8c8}
.line.gold{color:#f5c070}
.line.dim{color:#887;font-size:15px}
.line.cyan{color:#8cc8d8}
.line.magenta{color:#c8b8e8}
.line.big{font-size:22px;margin:14px 0}
.line.huge{font-size:30px;font-weight:bold;margin:18px 0}
#hint{position:fixed;bottom:60px;left:0;width:100%;text-align:center;z-index:99;color:rgba(255,255,255,.35);font-size:14px;display:none}
#hint.show{display:block;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.8}}
.heart-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
.heart-wrap svg{width:min(240px,60vw);animation:beat .7s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px rgba(255,100,150,.5))}
@keyframes beat{from{transform:scale(.85)}to{transform:scale(1.1)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stage"></div>
<div id="hint">✦ 轻触屏幕继续 ✦</div>

<script>
// ── BGM: Web Audio API ambient ──────────────────
let audioCtx=null;
function startBGM(){
  if(audioCtx)return;
  audioCtx=new AudioContext();
  const now=audioCtx.currentTime;
  // Soft pad chord: Dm7 (D F A C) in low octave
  const notes=[146.83,174.61,220,261.63]; // D4 F4 A4 C5
  notes.forEach(freq=>{
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.08,now+1.5);
    g.connect(audioCtx.destination);
    const o=audioCtx.createOscillator();
    o.type='sine';
    o.frequency.setValueAtTime(freq,now);
    // Slow vibrato
    const v=audioCtx.createOscillator();
    v.type='sine';v.frequency.setValueAtTime(0.3+Math.random()*0.4,now);
    const vg=audioCtx.createGain();
    vg.gain.setValueAtTime(2,now);
    v.connect(vg);vg.connect(o.frequency);
    v.start(now);o.connect(g);o.start(now);
  });
  // Low drone
  const dg=audioCtx.createGain();
  dg.gain.setValueAtTime(0,now);
  dg.gain.linearRampToValueAtTime(0.06,now+2);
  dg.connect(audioCtx.destination);
  const d=audioCtx.createOscillator();
  d.type='sine';d.frequency.setValueAtTime(73.42,now); // D2
  d.connect(dg);d.start(now);
}

// ── Canvas ──────────────────────────────────────
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rs();addEventListener('resize',rs);

// Nebulae (static glow spots)
const nebulae=[];
for(let i=0;i<6;i++){
  nebulae.push({
    x:Math.random()*W,y:Math.random()*H,
    r:80+Math.random()*160,
    hue:200+Math.random()*140,
    alpha:0.02+Math.random()*0.04
  });
}

// Stars - dense
const stars=[];
for(let i=0;i<250;i++){
  stars.push({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*2+.2,b:Math.random(),
    s:Math.random()*.015+.003,ph:Math.random()*6.28,
    twinkle:Math.random()<.15 // ~15% fast twinklers
  });
}

// Shooting stars
let shooter=null;
function ns(){shooter={x:Math.random()*W*.8+W*.1,y:Math.random()*H*.35,vx:(Math.random()>.5?1:-1)*(Math.random()*2.5+1),vy:Math.random()*1.2+.4,trail:[],len:18+Math.random()*15|0,life:35+Math.random()*30|0,age:0}}

function draw(){
  // Gradient background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0d30');
  bg.addColorStop(.3,'#0f0f28');
  bg.addColorStop(.6,'#0c0c20');
  bg.addColorStop(1,'#080818');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  // Glow orbs (simple, visible)
  const t=Date.now()/1000;
  for(let i=0;i<4;i++){
    const x=W*(.2+i*.2+.15*Math.sin(t*.3+i));
    const y=H*(.3+.15*Math.cos(t*.25+i*1.8));
    const r=120+Math.sin(t*.4+i)*30;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    const hue=[240,280,200,320][i];
    g.addColorStop(0,`hsla(${hue},60%,50%,.08)`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  
  // Stars (no nebulae - aurora replaces them)
  stars.forEach(s=>{
    s.b+=Math.sin(s.ph)*(s.twinkle?.04:.015);
    s.ph+=s.s;
    s.b=Math.max(.05,Math.min(1,s.b));
    const a=s.b;
    // Warm white stars
    ctx.fillStyle=`rgba(${255*a|0},${235*a|0},${220*a|0},${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();
    // Glow halo for bright stars
    if(a>.7){
      ctx.fillStyle=`rgba(255,230,200,${a*.15})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r*3,0,6.28);ctx.fill();
    }
  });
  
  // Shooting stars
  if(shooter){shooter.age++;shooter.x+=shooter.vx;shooter.y+=shooter.vy;shooter.trail.unshift({x:shooter.x,y:shooter.y});if(shooter.trail.length>shooter.len)shooter.trail.pop();if(shooter.age>shooter.life||shooter.y>H||shooter.x<0||shooter.x>W)shooter=null}
  if(!shooter&&Math.random()<.01)ns();
  if(shooter)shooter.trail.forEach((p,i)=>{
    const a=1-i/shooter.len;
    const v=180*a+75|0;
    ctx.fillStyle=`rgba(${v},${v},255,${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,3*(1-i/shooter.len)+.5,0,6.28);ctx.fill();
  });
  
  requestAnimationFrame(draw);
}draw();

// ── Petals ──────────────────────────────────────
const pc='*✦✿❀♥♡•✧✽❋';
setInterval(()=>{
  if(document.querySelectorAll('.petal').length>35)return;
  if(Math.random()>.35)return;
  const e=document.createElement('div');
  e.className='petal';e.textContent=pc[Math.random()*pc.length|0];
  e.style.cssText=`position:fixed;z-index:1;pointer-events:none;left:${Math.random()*90+5}%;top:-5%;font-size:${Math.random()*16+12}px;color:${['#f0a8c8','#ffb3c6','#ffc2d9','#f8d5e0','#ffe0ec','#e8d5f5'][Math.random()*6|0]};animation:fall ${Math.random()*7+5}s linear forwards;opacity:${Math.random()*.4+.6}`;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),14000);
},300);
const s=document.createElement('style');
s.textContent='@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg) translateX(0)}70%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(720deg) translateX(30px)}}';
document.head.appendChild(s);

// ── Scenes ──────────────────────────────────────
const scenes=[
  [{t:'其实我也不知道',c:'dim'},{t:'该怎么开口说这些话。',c:'dim',w:1800},{t:'但还是想让你知道——',c:'cyan',w:1200}],
  [{t:'我发现自己越来越期待',c:''},{t:'收到你的消息。',c:'pink',w:1600},{t:'哪怕只是一句「在干嘛」',c:''},{t:'也能让我对着屏幕笑半天。',c:'pink',w:2000}],
  [{t:'我开始注意到很多',c:'cyan'},{t:'以前不会在意的事：',c:'',w:1400},{t:'你爱喝几分糖的奶茶',c:''},{t:'你笑起来眼睛弯弯的很好看',c:'pink',w:2200}],
  [{t:'跟你一起的时候',c:'gold'},{t:'时间总是过得特别快',c:'gold',w:1600},{t:'说的话都很普通',c:''},{t:'但就是想跟你分享。',c:'pink',w:2200}],
  [{t:'我也有过很多犹豫。',c:'dim',w:1400},{t:'怕说出来连朋友都做不成。',c:'dim'},{t:'怕你觉得我自作多情。',c:'dim',w:1800}],
  [{t:'把这些话在对话框里',c:''},{t:'打了又删、删了又打。',c:'',w:2000},{t:'但这次我不想再删了。',c:'magenta big',w:2000}],
  [{t:'',c:'',w:400},{t:'我想认真地告诉你：',c:'magenta',w:1200},{t:'',c:'',w:300},{t:'我喜欢你。',c:'pink huge',w:2800}],
  [{t:'不是一时兴起，',c:''},{t:'是想了很久很久之后，',c:''},{t:'还是觉得很确定的那种。',c:'pink',w:2200},{t:'你愿意，做我女朋友吗？',c:'gold big',w:3000}],
  [{type:'h'}],
  [{t:'你不用现在就回答我，',c:'dim',w:1200},{t:'我只是想让你知道——',c:'',w:800},{t:'有一个人，',c:'cyan'},{t:'真的很喜欢你。',c:'pink big',w:2400},{t:'谢谢你出现在我的生活里。',c:'gold',w:2000}],
];

let si=0,li=0,busy=false,timer=null;
const stage=document.getElementById('stage'),hint=document.getElementById('hint');

function clearAll(){
  stage.innerHTML='';
  hint.classList.remove('show');
  const h=document.querySelector('.heart-wrap');if(h)h.remove();
}

function showLine(){
  const scene=scenes[si];
  if(li>=scene.length){
    busy=false;
    if(si===8){si++;showScene();return}
    hint.classList.add('show');
    return;
  }
  const l=scene[li++];
  if(l.type==='h'){
    const wrap=document.createElement('div');
    wrap.className='heart-wrap';
    wrap.innerHTML='<svg viewBox="0 0 100 90"><path d="M50 85 C25 60,0 45,0 25 C0 10,12 0,25 0 C35 0,45 10,50 18 C55 10,65 0,75 0 C88 0,100 10,100 25 C100 45,75 60,50 85Z" fill="#ff6b8a"/></svg>';
    document.body.appendChild(wrap);
    timer=setTimeout(()=>{wrap.remove();li=0;si++;if(si<scenes.length)showScene()},4000);
    return;
  }
  const el=document.createElement('div');
  el.className='line';
  if(l.c)el.className+=' '+l.c;
  el.textContent=l.t;
  stage.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  timer=setTimeout(showLine,l.w||(l.t.trim()?l.t.length*65+400:300));
}

function showScene(){
  if(si>=scenes.length){hint.classList.remove('show');return}
  clearAll();li=0;busy=true;showLine();
}

document.addEventListener('click',()=>{
  startBGM(); // Start music on first touch
  if(busy)return;
  if(timer)clearTimeout(timer);
  hint.classList.remove('show');
  si++;
  if(si>=scenes.length){hint.classList.remove('show');return}
  showScene();
});

showScene(0);
</script>
</body>
</html>
